# Default profile: in-memory H2 for local development and mvn test.
# Railway sets SPRING_PROFILES_ACTIVE=prod, which loads application-prod.properties on top of this file.

# Database configuration
spring.datasource.url=jdbc:h2:mem:taskflowdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# No dialect is set on purpose. Hibernate detects H2 here and PostgreSQL in the prod profile.
# A hard-coded H2Dialect would also apply to prod and break Postgres.

# H2 Console (local only; the prod profile turns this off)
spring.h2.console.enabled=true

# Railway injects PORT. Local runs and tests keep 8080 when PORT is unset.
server.port=${PORT:8080}

# Comma-separated browser origins allowed to call /api/**.
# Set ALLOWED_ORIGINS on Railway to the Netlify site (and any preview URLs).
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
