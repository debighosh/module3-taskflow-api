# Prod profile for Railway Postgres. Activate with SPRING_PROFILES_ACTIVE=prod.
# Railway's DATABASE_URL is a postgres:// URL, which JDBC cannot use.
# The JDBC URL is built from the PG* variables the Postgres plugin injects.
# Nothing here is a secret: every value is read from the environment at startup.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
# The default profile sets the H2 driver. Override it or Postgres connections fail.
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# The H2 console must not be exposed when the app is on the public internet.
spring.h2.console.enabled=false
